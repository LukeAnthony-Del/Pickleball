<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pickleball Rentals</title>

  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
</head>
<body>
  <main>
    <h1>Pickleball Rentals</h1>

    <form id="rentalForm">
      <input id="customer" type="text" placeholder="Customer name" required>

      <input id="equipment" type="text" placeholder="Equipment rented" required>

      <input id="date" type="date" required>

      <input id="amount" type="number" step="0.01" placeholder="Amount" required>

      <button type="submit">Add Rental</button>
    </form>

    <h2>Rental Records</h2>

    <div id="rentalList"></div>
  </main>

  <script src="./app.js"></script>
</body>
</html>
